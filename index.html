<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cha Ji 茶记 · Diario de Té</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div class="page">

  <header class="hero">
    <p class="eyebrow">茶记 · Diario digital de té</p>
    <h1>Cha Ji</h1>
    <p class="sub">Registro de catas y despensa personal de Gongfu Cha.</p>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" id="btn-catas" role="tab" aria-selected="true" onclick="showTab('catas')">Diario</button>
    <button class="tab" id="btn-stash" role="tab" aria-selected="false" onclick="showTab('stash')">Despensa</button>
  </nav>

  <!-- ---------- DIARIO (catas) ---------- -->
  <section id="view-catas" class="view">

    <div class="controls">
      <div class="search-wrap">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="search" id="search-catas" placeholder="Buscar cata por té, tienda, comentario…" aria-label="Buscar en el diario">
      </div>
    </div>

    <p class="results-count" id="count-catas" aria-live="polite"></p>

    <ul class="stash" id="catas-list"></ul>

    <p class="empty-state" id="empty-catas" hidden>No hay catas registradas todavía. Añádelas con <code>python scripts/cata.py</code>.</p>
  </section>

  <!-- ---------- DESPENSA (stash) ---------- -->
  <section id="view-stash" class="view" hidden>

    <div class="controls">
      <div class="search-wrap">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="search" id="search-stash" placeholder="Buscar por nombre, origen, tienda…" aria-label="Buscar en la despensa">
      </div>
      <div class="selects">
        <select id="filter-tipo" aria-label="Filtrar por tipo">
          <option value="">Todos los tipos</option>
        </select>
        <select id="filter-tienda" aria-label="Filtrar por tienda">
          <option value="">Todas las tiendas</option>
        </select>
        <button id="filter-stock" class="chip" type="button" aria-pressed="false">
          <span class="chip-dot"></span> Sólo en stock
        </button>
      </div>
    </div>

    <p class="results-count" id="count-stash" aria-live="polite"></p>

    <ul class="stash" id="stash-list"></ul>

    <p class="empty-state" id="empty-stash" hidden>Ningún té coincide con esa búsqueda. Prueba con otro término.</p>

    <footer class="foot">
      <span class="legend-title">Color por tipo</span>
      <ul class="legend" id="legend"></ul>
    </footer>
  </section>

</div>

<script src="assets/app.js"></script>
</body>
</html>
